[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pyawk"
version = "1.1.0"
description = "A POSIX-compatible AWK interpreter in pure Python"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Keith Haviland" }]

[project.optional-dependencies]
test = ["pytest>=7", "ruff"]

[project.scripts]
pyawk = "pyawk.cli:main"

[tool.setuptools]
packages = ["pyawk"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
extend-exclude = ["scripts/make_corpus.py"]

[tool.ruff.lint]
select = ["E", "F", "W"]
